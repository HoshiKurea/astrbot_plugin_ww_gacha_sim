name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q main.py src
      - run: python -m ruff check main.py src tests
      - run: python -m pytest -q

  command-runtime:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        astrbot-version: ['4.27.5', '4.28.1']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install "astrbot==${{ matrix.astrbot-version }}" -r requirements.txt
      - run: python tests/runtime_commands.py
      - run: python tests/runtime_resources.py

  pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - working-directory: webui
        run: npm ci
      - working-directory: webui
        run: npm run check
      - working-directory: webui
        run: npm run build
      - run: git diff --exit-code -- pages/admin
